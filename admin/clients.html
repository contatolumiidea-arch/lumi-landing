<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — LUMI Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

<div class="admin-layout">
  <div id="admin-sidebar-mount"></div>

  <div class="admin-main">
    <div class="admin-topbar">
      <span class="topbar-title" id="topbar-title">Clientes LUMI</span>
      <span class="topbar-breadcrumb" id="topbar-crumb"></span>
    </div>

    <div class="admin-content">

      <!-- LIST VIEW -->
      <div id="view-list">
        <div class="filter-bar">
          <input class="filter-input" id="search" type="text" placeholder="Buscar por nome, email ou empresa..." oninput="onSearch()">
          <select class="filter-select" id="filter-status" onchange="loadClients()">
            <option value="">Todos os status</option>
            <option value="new">Novo cliente</option>
            <option value="pending_onboarding">Aguard. onboarding</option>
            <option value="in_production">Em produção</option>
            <option value="review">Revisão</option>
            <option value="published">Publicado</option>
            <option value="canceled">Cancelado</option>
          </select>
        </div>

        <div class="section-header">
          <span class="section-title">Corretores</span>
          <span class="section-count" id="total-count">—</span>
          <span class="section-spacer"></span>
        </div>

        <div class="table-wrap">
          <div class="table-wrap-scroll">
            <table>
              <thead>
                <tr>
                  <th>Corretor</th>
                  <th>Empresa</th>
                  <th>País</th>
                  <th>Plano</th>
                  <th>Status</th>
                  <th>Assinatura</th>
                  <th>Compra</th>
                </tr>
              </thead>
              <tbody id="clients-tbody">
                <tr><td colspan="7"><div class="loading"><div class="spinner"></div> Carregando...</div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>

      <!-- DETAIL VIEW -->
      <div id="view-detail" style="display:none;">
        <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px;">
          <button class="btn btn-outline btn-sm" onclick="showList()">← Voltar para clientes</button>
          <span id="briefing-status-badge"></span>
        </div>

        <div class="detail-grid" id="detail-cards">
          <div class="loading"><div class="spinner"></div></div>
        </div>

        <div class="section-header" style="margin-top:28px;">
          <span class="section-title">Briefing para criação da Landing Page</span>
          <span class="section-count" id="briefing-step-count"></span>
        </div>
        <div id="briefing-wrap">
          <div class="loading"><div class="spinner"></div></div>
        </div>

        <div class="section-header" style="margin-top:28px;">
          <span class="section-title">Leads Recebidos</span>
          <span class="section-count" id="leads-count">—</span>
        </div>
        <div class="table-wrap" id="leads-wrap">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Edit Status Modal -->
<div class="modal-overlay" id="modal-status" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">Atualizar Status</div>
    <div class="field-group">
      <label class="field-label">Status do cliente</label>
      <select class="field-select" id="edit-status">
        <option value="new">Novo cliente</option>
        <option value="pending_onboarding">Aguardando onboarding</option>
        <option value="in_production">Em produção</option>
        <option value="review">Revisão</option>
        <option value="published">Publicado</option>
        <option value="canceled">Cancelado</option>
      </select>
    </div>
    <div class="field-group">
      <label class="field-label">URL da Landing Page (ao publicar)</label>
      <input class="field-input" id="edit-url" type="url" placeholder="https://...">
    </div>
    <div class="field-group">
      <label class="field-label">Notas internas</label>
      <textarea class="field-textarea" id="edit-notes" placeholder="Observações da equipe LUMI..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveStatus()">Salvar</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
let currentPage = 1;
let searchTimeout;
let currentClientId;

(async () => {
  renderLayout('clients');
  await requireAuth();

  // Check if opening a specific client from URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('id')) {
    await showDetail(params.get('id'));
  } else {
    await loadClients();
  }
})();

async function loadClients(page = 1) {
  currentPage = page;
  const status = document.getElementById('filter-status').value;
  const search = document.getElementById('search').value.trim();

  const params = new URLSearchParams({ page, limit: 25 });
  if (status) params.set('status', status);
  if (search) params.set('search', search);

  const tbody = document.getElementById('clients-tbody');
  tbody.innerHTML = `<tr><td colspan="7"><div class="loading"><div class="spinner"></div></div></td></tr>`;

  const data = await API.get(`/admin/clients?${params}`);
  if (!data) return;

  document.getElementById('total-count').textContent = data.total ?? 0;

  if (!data.clients?.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><div class="empty-icon">👤</div>Nenhum cliente encontrado.</div></td></tr>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  tbody.innerHTML = data.clients.map(c => {
    const sub = c.lumi_subscriptions?.[0];
    return `
      <tr onclick="showDetail('${c.id}')">
        <td>
          <div class="td-name">${c.full_name}</div>
          <div class="td-sub">${c.email}</div>
        </td>
        <td>${c.business_name || '—'}</td>
        <td>${c.country || '—'}</td>
        <td>${sub ? pillHTML(sub.plan_type) : '—'}</td>
        <td>${pillHTML(c.client_status)}</td>
        <td>${sub ? pillHTML(sub.status) : '—'}</td>
        <td class="td-date">${fmtDate(c.purchased_at)}</td>
      </tr>`;
  }).join('');

  // Pagination
  const totalPages = Math.ceil(data.total / 25);
  document.getElementById('pagination').innerHTML = totalPages > 1 ? `
    <span>${(page-1)*25+1}–${Math.min(page*25, data.total)} de ${data.total}</span>
    <button class="btn btn-outline" onclick="loadClients(${page-1})" ${page<=1?'disabled':''}>‹ Anterior</button>
    <button class="btn btn-outline" onclick="loadClients(${page+1})" ${page>=totalPages?'disabled':''}>Próximo ›</button>
  ` : '';
}

function onSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => loadClients(1), 350);
}

async function showDetail(id) {
  currentClientId = id;
  document.getElementById('view-list').style.display = 'none';
  document.getElementById('view-detail').style.display = 'block';
  document.getElementById('topbar-title').textContent = 'Clientes LUMI';
  document.getElementById('topbar-crumb').textContent = '/ Briefing';

  const data = await API.get(`/admin/client?id=${id}`);
  if (!data) return;

  const { client, onboarding, leads } = data;
  const sub = client.lumi_subscriptions?.[0];
  const page = client.landing_pages?.[0];

  // ── Info cards (topo) ────────────────────────────────────────────
  document.getElementById('detail-cards').innerHTML = `
    <div class="detail-card">
      <div class="detail-card-title">Informações do Corretor</div>
      <div class="detail-row"><span class="detail-key">Nome</span><span class="detail-val">${client.full_name || '—'}</span></div>
      <div class="detail-row"><span class="detail-key">Email</span><span class="detail-val">${client.email || '—'}</span></div>
      <div class="detail-row"><span class="detail-key">Telefone</span><span class="detail-val">${client.phone || '—'}</span></div>
      <div class="detail-row"><span class="detail-key">Empresa</span><span class="detail-val">${client.business_name || '—'}</span></div>
      <div class="detail-row"><span class="detail-key">País</span><span class="detail-val">${client.country || '—'}</span></div>
      <div class="detail-row"><span class="detail-key">Comprou em</span><span class="detail-val">${fmtDatetime(client.purchased_at)}</span></div>
      <div class="detail-row"><span class="detail-key">Onboarding concluído</span><span class="detail-val">${client.onboarding_completed_at ? fmtDate(client.onboarding_completed_at) : 'Pendente'}</span></div>
    </div>
    <div class="detail-card">
      <div class="detail-card-title">Status e Assinatura</div>
      <div class="detail-row"><span class="detail-key">Status</span><span class="detail-val">${pillHTML(client.client_status)}</span></div>
      <div class="detail-row"><span class="detail-key">Plano</span><span class="detail-val">${sub ? pillHTML(sub.plan_type) : '—'}</span></div>
      <div class="detail-row"><span class="detail-key">Assinatura</span><span class="detail-val">${sub ? pillHTML(sub.status) : '—'}</span></div>
      <div class="detail-row"><span class="detail-key">Renova em</span><span class="detail-val">${sub?.current_period_end ? fmtDate(sub.current_period_end) : '—'}</span></div>
      <div class="detail-row"><span class="detail-key">Landing Page</span><span class="detail-val">${page?.published_url ? `<a href="${page.published_url}" target="_blank" style="color:var(--gold)">${page.published_url}</a>` : pillHTML(page?.status || 'draft')}</span></div>
      <div class="detail-row"><span class="detail-key">Notas internas</span><span class="detail-val">${client.notes || '—'}</span></div>
      <div style="margin-top:12px;">
        <button class="btn btn-primary btn-sm" onclick="openStatusModal('${client.client_status}', '${(client.notes || '').replace(/'/g, "\\'")}', '${page?.published_url || ''}')">Editar status</button>
      </div>
    </div>
  `;

  // Badge de status no topo
  document.getElementById('briefing-status-badge').innerHTML = onboarding
    ? `${pillHTML(onboarding.status)} &nbsp; Step ${onboarding.current_step || '—'} / 8`
    : '';

  // ── Briefing completo ────────────────────────────────────────────
  document.getElementById('briefing-wrap').innerHTML = renderBriefing(onboarding);

  // ── Leads ────────────────────────────────────────────────────────
  document.getElementById('leads-count').textContent = leads?.length || 0;
  if (leads?.length) {
    document.getElementById('leads-wrap').innerHTML = `
      <div class="table-wrap-scroll">
        <table>
          <thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Origem</th><th>Data</th></tr></thead>
          <tbody>
            ${leads.map(l => `
              <tr>
                <td>${l.lead_name || '—'}</td>
                <td class="td-mono">${l.lead_email || '—'}</td>
                <td class="td-mono">${l.lead_phone || '—'}</td>
                <td>${pillHTML(l.origin)}</td>
                <td class="td-date">${fmtDatetime(l.created_at)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } else {
    document.getElementById('leads-wrap').innerHTML = `<div class="empty"><div class="empty-icon">📊</div>Nenhum lead gerado ainda.</div>`;
  }
}

// ── Briefing renderer ─────────────────────────────────────────────────────────
function renderBriefing(onboarding) {
  if (!onboarding) {
    return `<div class="empty" style="margin-top:12px;"><div class="empty-icon">📋</div>Onboarding não iniciado.</div>`;
  }

  // O submitForm envia this.data completo como onboarding_data → salvo em step1_business
  const d = onboarding.step1_business || {};
  const social = onboarding.social_links || {};
  const testimonials = onboarding.testimonials || [];

  const ni = v => v || '<span style="color:var(--muted);font-style:italic;">não informado</span>';
  const row = (label, value) => `
    <div class="detail-row">
      <span class="detail-key">${label}</span>
      <span class="detail-val">${ni(value)}</span>
    </div>`;
  const list = arr => Array.isArray(arr) && arr.length ? arr.join(', ') : null;
  const swatch = hex => hex ? `<span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${hex};border:1px solid var(--border);vertical-align:middle;margin-right:6px;"></span>${hex}` : null;

  const section = (title, icon, content) => `
    <div class="briefing-section">
      <div class="briefing-section__header">
        <span class="briefing-section__icon">${icon}</span>
        <span class="briefing-section__title">${title}</span>
      </div>
      <div class="briefing-section__body detail-card" style="margin-top:0;border-radius:0 0 10px 10px;">
        ${content}
      </div>
    </div>`;

  // 1 — Perfil do negócio
  const s1 = section('Perfil do Negócio', '👤', `
    ${row('Nome completo', d.fullName)}
    ${row('Nome da empresa', d.businessName)}
    ${row('Email', d.email)}
    ${row('Telefone', d.phone)}
    ${row('WhatsApp', d.whatsapp)}
    ${row('Cidade', d.city)}
    ${row('País', d.country)}
    ${row('Idioma principal', d.language)}
    ${row('Anos de experiência', d.years)}
    ${row('Bio / Apresentação', d.bio ? `<span style="white-space:pre-wrap;">${d.bio}</span>` : null)}
    ${row('Especialidades', list(d.specialties))}
  `);

  // Helper: render an image from URL or base64 Data URL
  const imgEl = (src, alt, h = 60) => src
    ? `<img src="${src}" alt="${alt}" style="max-height:${h}px;max-width:220px;border-radius:4px;background:#fff;padding:4px;">`
    : null;

  // Helper: render a clickable file link
  const fileLink = (url, label) => url
    ? `<a href="${url}" target="_blank" style="color:var(--gold);text-decoration:underline;">${label}</a>`
    : null;

  // Helper: render a small image grid
  const imgGrid = (urls) => {
    if (!urls?.length) return null;
    return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">${
      urls.map(u => `<img src="${u}" style="width:64px;height:64px;object-fit:cover;border-radius:4px;background:#fff;">`).join('')
    }</div>`;
  };

  // Compatibility: logoUrl (new) or logoDataUrl (legacy base64)
  const logoSrc = d.logoUrl || d.logoDataUrl || null;
  const profSrc = d.professionalPhotoUrl || d.professionalPhoto || null;

  // 2 — Identidade da marca
  const s2 = section('Identidade da Marca', '🎨', `
    ${row('Estilo visual escolhido', d.stylePreference)}
    ${row('Cor primária', swatch(d.primaryColor))}
    ${row('Cor secundária', swatch(d.secondaryColor))}
    ${logoSrc
      ? `<div class="detail-row"><span class="detail-key">Logo</span><span class="detail-val">${imgEl(logoSrc, 'Logo')}</span></div>`
      : row('Logo', null)}
    ${profSrc
      ? `<div class="detail-row"><span class="detail-key">Foto profissional</span><span class="detail-val">${imgEl(profSrc, 'Foto profissional', 80)}</span></div>`
      : row('Foto profissional', null)}
    ${(d.teamPhotoUrls || d.teamPhotos)?.length
      ? `<div class="detail-row"><span class="detail-key">Fotos da equipe</span><span class="detail-val">${imgGrid(d.teamPhotoUrls || d.teamPhotos)}</span></div>`
      : row('Fotos da equipe', null)}
    ${(d.brandGalleryUrls || d.brandGallery)?.length
      ? `<div class="detail-row"><span class="detail-key">Galeria da marca</span><span class="detail-val">${imgGrid(d.brandGalleryUrls || d.brandGallery)}</span></div>`
      : row('Galeria da marca', null)}
    ${(() => {
      // Support new {type,url} objects (d.videos) and legacy plain-URL arrays (d.videoUrls)
      const items = d.videos?.length
        ? d.videos
        : (d.videoUrls?.length ? d.videoUrls.map(u => ({ type: 'upload', url: u })) : []);
      if (!items.length) return row('Vídeos', null);
      const links = items.map((v, i) => {
        const url   = typeof v === 'string' ? v : v.url;
        const vtype = typeof v === 'string' ? 'upload' : (v.type || 'upload');
        const label = vtype === 'youtube' ? '▶️ YouTube' : vtype === 'drive' ? '🔗 Google Drive' : `📥 Vídeo ${i + 1}`;
        return `<a href="${url}" target="_blank" rel="noopener" style="color:var(--gold);text-decoration:underline;margin-right:10px;">${label}</a>`;
      }).join('');
      return `<div class="detail-row"><span class="detail-key">Vídeos</span><span class="detail-val">${links}</span></div>`;
    })()}
  `);

  // 3 — Informações comerciais
  const s3 = section('Informações Comerciais', '🏠', `
    ${row('Tipos de imóvel', list(d.propertyTypes))}
    ${row('Regiões de atuação', list(d.regions))}
  `);

  // 4 — Presença digital
  const s4 = section('Presença Digital', '🌐', `
    ${row('Website', social.website || d.website)}
    ${row('Instagram', social.instagram || d.instagram)}
    ${row('Facebook', social.facebook || d.facebook)}
    ${row('LinkedIn', social.linkedin || d.linkedin)}
    ${row('Google Meu Negócio', (social.google || d.googleUrl) ? `<a href="${social.google || d.googleUrl}" target="_blank" style="color:var(--gold)">${social.google || d.googleUrl}</a>` : null)}
  `);

  // 5 — Público e clientes
  const contactChannelLabel = { phone: 'Telefone', whatsapp: 'WhatsApp', email: 'Email', sms: 'SMS' };
  const captureFormLabel = {
    buyer_form:     'Formulário de Consulta do Comprador',
    seller_form:    'Formulário de Avaliação do Vendedor',
    newsletter:     'Inscrição no Boletim',
    ebook_download: 'Download de Ebook',
  };
  const contactChannelsList = Array.isArray(d.contactChannels)
    ? d.contactChannels.map(c => contactChannelLabel[c] || c).join(', ')
    : (d.leadChannel ? (contactChannelLabel[d.leadChannel] || d.leadChannel) : null);
  const _forms = d.enabled_forms || d.captureForms;
  const captureFormsList = Array.isArray(_forms)
    ? _forms.map(f => captureFormLabel[f] || f).join(', ')
    : null;
  const s5 = section('Público e Clientes', '🎯', `
    ${row('Público-alvo', list(d.leadWho))}
    ${row('Canais de contato da landing page', contactChannelsList)}
    ${row('WhatsApp / Telefone', d.leadWhatsapp)}
    ${row('Email de contato', d.leadEmail)}
    ${row('Horário de atendimento', d.businessHours)}
    ${row('Formulários de captura ativos', captureFormsList)}
    ${row('Mensagem de confirmação ao visitante', d.leadWelcomeMessage ? `<span style="white-space:pre-wrap;">${d.leadWelcomeMessage}</span>` : null)}
  `);

  // Ebook URLs — new (URL) or legacy (base64 Data URL)
  const buyerEbook  = d.buyerEbookUrl  || (d.buyerEbook  && !d.buyerEbook.startsWith('data:')  ? d.buyerEbook  : null);
  const sellerEbook = d.sellerEbookUrl || (d.sellerEbook && !d.sellerEbook.startsWith('data:') ? d.sellerEbook : null);
  const buyerLegacy  = !buyerEbook  && d.buyerEbook  ? '(arquivo base64 — re-upload necessário)' : null;
  const sellerLegacy = !sellerEbook && d.sellerEbook ? '(arquivo base64 — re-upload necessário)' : null;

  // 6 — Lead Magnet
  const s6 = section('Lead Magnet', '📘', `
    ${row('Tipo de lead magnet', d.leadMagnetOption)}
    ${row('Idiomas do guia LUMI', list(d.lumiGuideLanguages))}
    ${buyerEbook  ? `<div class="detail-row"><span class="detail-key">E-book Comprador</span><span class="detail-val">${fileLink(buyerEbook, '📥 Baixar PDF')}</span></div>`  : row('E-book Comprador',  buyerLegacy)}
    ${sellerEbook ? `<div class="detail-row"><span class="detail-key">E-book Vendedor</span><span class="detail-val">${fileLink(sellerEbook, '📥 Baixar PDF')}</span></div>` : row('E-book Vendedor', sellerLegacy)}
  `);

  // 7 — Depoimentos
  let s7content = '';
  if (testimonials.length) {
    s7content = testimonials.map((t, i) => `
      <div style="padding:12px 0;${i > 0 ? 'border-top:1px solid var(--border);' : ''}">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
          ${(t.photoUrl || t.photo)
            ? `<img src="${t.photoUrl || t.photo}" alt="${t.name || ''}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;">`
            : `<div style="width:40px;height:40px;border-radius:50%;background:var(--gold-mid);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);flex-shrink:0;">${(t.name || '?').charAt(0).toUpperCase()}</div>`}
          <div>
            <strong style="color:var(--text);">${t.name || '—'}</strong>
            ${t.videoUrl ? `<a href="${t.videoUrl}" target="_blank" rel="noopener" style="display:block;font-size:11px;color:var(--gold);margin-top:2px;">▶ Assistir vídeo do depoimento</a>` : ''}
          </div>
        </div>
        <div style="color:var(--muted);font-size:.85rem;line-height:1.5;">"${t.text || '—'}"</div>
      </div>`).join('');
  } else {
    s7content = row('Depoimentos', null);
  }
  const s7 = section('Depoimentos', '⭐', s7content);

  // 8 — Materiais enviados
  const matParts = [
    logoSrc   ? `<div class="detail-row"><span class="detail-key">Logo</span><span class="detail-val">${imgEl(logoSrc, 'Logo', 72)}</span></div>` : '',
    profSrc   ? `<div class="detail-row"><span class="detail-key">Foto profissional</span><span class="detail-val">${imgEl(profSrc, 'Foto profissional', 90)}</span></div>` : '',
    (d.teamPhotoUrls || d.teamPhotos)?.length    ? `<div class="detail-row"><span class="detail-key">Fotos da equipe</span><span class="detail-val">${imgGrid(d.teamPhotoUrls || d.teamPhotos)}</span></div>` : '',
    (d.brandGalleryUrls || d.brandGallery)?.length ? `<div class="detail-row"><span class="detail-key">Galeria</span><span class="detail-val">${imgGrid(d.brandGalleryUrls || d.brandGallery)}</span></div>` : '',
    buyerEbook  ? `<div class="detail-row"><span class="detail-key">E-book Comprador</span><span class="detail-val">${fileLink(buyerEbook, '📥 Baixar PDF')}</span></div>`  : '',
    sellerEbook ? `<div class="detail-row"><span class="detail-key">E-book Vendedor</span><span class="detail-val">${fileLink(sellerEbook, '📥 Baixar PDF')}</span></div>` : '',
  ].filter(Boolean).join('');

  const s8 = section('Materiais Enviados', '📎', matParts || row('Arquivos', null));

  return `<div class="briefing-sections">${s1}${s2}${s3}${s4}${s5}${s6}${s7}${s8}</div>`;
}

function showList() {
  document.getElementById('view-detail').style.display = 'none';
  document.getElementById('view-list').style.display = 'block';
  document.getElementById('topbar-crumb').textContent = '';
  history.replaceState(null, '', '/admin/clients.html');
}

function openStatusModal(status, notes, url) {
  document.getElementById('edit-status').value = status;
  document.getElementById('edit-notes').value = notes;
  document.getElementById('edit-url').value = url;
  document.getElementById('modal-status').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal-status').style.display = 'none';
}

async function saveStatus() {
  const body = {
    client_status:    document.getElementById('edit-status').value,
    notes:            document.getElementById('edit-notes').value,
    landing_page_url: document.getElementById('edit-url').value || undefined,
  };
  const result = await API.patch(`/admin/client?id=${currentClientId}`, body);
  if (result?.ok) {
    closeModal();
    toast('Status atualizado.', 'success');
    await showDetail(currentClientId);
  } else {
    toast(result?.error || 'Erro ao salvar.', 'error');
  }
}
</script>
</body>
