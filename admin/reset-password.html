<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha — LUMI Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">LUMI IDEA</div>
    <div class="login-subtitle">Redefinição de senha</div>

    <div class="login-error" id="reset-error"></div>

    <div id="reset-success" style="display:none;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);border-radius:8px;padding:14px 16px;font-size:.875rem;color:#4ade80;margin-bottom:16px;line-height:1.5">
      Senha redefinida com sucesso! <a href="/admin/" style="color:#D4AF37;text-decoration:underline">Clique aqui para fazer login.</a>
    </div>

    <form id="reset-form">
      <div class="field-group">
        <label class="field-label" for="new-password">Nova senha</label>
        <div style="position:relative">
          <input class="field-input" id="new-password" type="password" required placeholder="Mínimo 8 caracteres" autocomplete="new-password" style="padding-right:42px">
          <button type="button" aria-label="Mostrar senha" onclick="togglePwd('new-password',this)" style="position:absolute;right:0;top:0;height:100%;width:40px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(212,175,55,.5);padding:0;transition:color .15s" onmouseenter="this.style.color='rgba(212,175,55,.9)'" onmouseleave="this.style.color='rgba(212,175,55,.5)'">
            <svg class="eye-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" style="display:none" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label" for="confirm-password">Confirmar nova senha</label>
        <div style="position:relative">
          <input class="field-input" id="confirm-password" type="password" required placeholder="Repita a senha" autocomplete="new-password" style="padding-right:42px">
          <button type="button" aria-label="Mostrar senha" onclick="togglePwd('confirm-password',this)" style="position:absolute;right:0;top:0;height:100%;width:40px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(212,175,55,.5);padding:0;transition:color .15s" onmouseenter="this.style.color='rgba(212,175,55,.9)'" onmouseleave="this.style.color='rgba(212,175,55,.5)'">
            <svg class="eye-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" style="display:none" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button class="login-btn" type="submit" id="reset-btn">Salvar nova senha</button>
    </form>

    <div style="text-align:center;margin-top:18px">
      <a href="/admin/" style="color:var(--text-muted);font-size:.83rem;text-decoration:none">← Voltar ao login</a>
    </div>
  </div>
</div>

<script>
  function togglePwd(inputId, btn) {
    const input  = document.getElementById(inputId);
    const eyeOn  = btn.querySelector('.eye-on');
    const eyeOff = btn.querySelector('.eye-off');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    eyeOn.style.display  = showing ? '' : 'none';
    eyeOff.style.display = showing ? 'none' : '';
  }

  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('reset-error').textContent = 'Link inválido. Solicite uma nova recuperação de senha.';
    document.getElementById('reset-error').style.display = 'block';
    document.getElementById('reset-form').style.display = 'none';
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn     = document.getElementById('reset-btn');
    const errEl   = document.getElementById('reset-error');
    const success = document.getElementById('reset-success');
    errEl.style.display = 'none';

    const password = document.getElementById('new-password').value;
    const confirm  = document.getElementById('confirm-password').value;

    if (password !== confirm) {
      errEl.textContent = 'As senhas não coincidem.';
      errEl.style.display = 'block';
      return;
    }
    if (password.length < 8) {
      errEl.textContent = 'A senha deve ter no mínimo 8 caracteres.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Salvando...';

    try {
      const r = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const data = await r.json();

      if (!r.ok) {
        errEl.textContent = data.error || 'Erro ao redefinir senha.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Salvar nova senha';
        return;
      }

      document.getElementById('reset-form').style.display = 'none';
      success.style.display = 'block';
    } catch {
      errEl.textContent = 'Erro de conexão. Tente novamente.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Salvar nova senha';
    }
  });
</script>
</body>
</html>
