<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interessados — LUMI Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <meta name="robots" content="noindex, nofollow">
  <style>
    /* ── Prospect detail modal ── */
    .prospect-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(3px);
      z-index: 900;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .prospect-modal-overlay.is-open { display: flex; }
    .prospect-modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      box-shadow: 0 16px 48px rgba(0,0,0,.5);
      position: relative;
    }
    .prospect-modal__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .prospect-modal__name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }
    .prospect-modal__close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .prospect-modal__close:hover { color: var(--text-primary); background: var(--bg-hover); }
    .prospect-modal__body { padding: 20px 24px; }
    .prospect-detail-row {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: .875rem;
    }
    .prospect-detail-row:last-child { border-bottom: none; }
    .prospect-detail-label {
      color: var(--text-muted);
      min-width: 100px;
      flex-shrink: 0;
    }
    .prospect-detail-value {
      color: var(--text-primary);
      word-break: break-word;
      flex: 1;
    }
    .prospect-message-box {
      background: var(--bg-hover);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: .875rem;
      color: var(--text-primary);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .prospect-modal__actions {
      display: flex;
      gap: 10px;
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .prospect-modal__status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-hover);
    }
    .prospect-modal__status-label {
      font-size: .8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .prospect-status-select {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: .85rem;
      cursor: pointer;
    }
    .prospect-status-select:focus { outline: none; border-color: var(--color-gold); }
    .btn-reply {
      background: none;
      border: 1px solid var(--color-gold);
      color: var(--color-gold);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s;
    }
    .btn-reply:hover { background: rgba(212,175,55,.1); }
    .prospect-status-msg {
      font-size: .8rem;
      margin-left: auto;
      padding: 0 4px;
    }
    .prospect-status-msg.ok  { color: #4ade80; }
    .prospect-status-msg.err { color: #f87171; }
    /* clickable row */
    .prospects-table tr[data-prospect-id] { cursor: pointer; }
    .prospects-table tr[data-prospect-id]:hover td { background: var(--bg-hover); }
    /* reply area */
    .reply-area {
      display: none;
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      flex-direction: column;
      gap: 10px;
    }
    .reply-area.is-open { display: flex; }
    .reply-area__label {
      font-size: .8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .reply-area__to {
      font-size: .8rem;
      color: var(--text-muted);
      margin-top: -4px;
    }
    .reply-textarea {
      width: 100%;
      min-height: 120px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: .875rem;
      line-height: 1.6;
      padding: 10px 12px;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
    }
    .reply-textarea:focus { outline: none; border-color: var(--color-gold); }
    .reply-actions { display: flex; gap: 8px; align-items: center; }
    .btn-send-reply {
      background: var(--color-gold);
      border: none;
      color: #000;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-send-reply:disabled { opacity: .5; cursor: not-allowed; }
    .btn-cancel-reply {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: .85rem;
      cursor: pointer;
    }
    .reply-status {
      font-size: .8rem;
      margin-left: auto;
    }
    .reply-status.ok  { color: #4ade80; }
    .reply-status.err { color: #f87171; }
  </style>
</head>
<body>

<div class="admin-layout">
  <div id="admin-sidebar-mount"></div>

  <div class="admin-main">
    <div class="admin-topbar">
      <span class="topbar-title">Interessados na LUMI</span>
    </div>

    <div class="admin-content">
      <div class="filter-bar">
        <input class="filter-input" id="search" type="text" placeholder="Buscar por nome ou email..." oninput="onSearch()">
        <select class="filter-select" id="filter-origin" onchange="loadProspects(1)">
          <option value="">Todas as origens</option>
          <option value="leadmagnet">Leadmagnet</option>
          <option value="newsletter">Newsletter</option>
          <option value="contact_form">Formulário contato</option>
        </select>
        <select class="filter-select" id="filter-status" onchange="loadProspects(1)">
          <option value="">Todos os status</option>
          <option value="new">Novo</option>
          <option value="contacted">Em contato</option>
          <option value="potential">Cliente potencial</option>
          <option value="closed">Fechado</option>
          <option value="archived">Arquivado</option>
          <option value="converted">Convertido</option>
        </select>
      </div>

      <div class="section-header">
        <span class="section-title">Interessados</span>
        <span class="section-count" id="total-count">—</span>
      </div>

      <div class="table-wrap">
        <div class="table-wrap-scroll">
          <table class="prospects-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Mensagem</th>
                <th>Origem</th>
                <th>Status</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody id="prospects-tbody">
              <tr><td colspan="6"><div class="loading"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── Prospect detail modal ── -->
<div class="prospect-modal-overlay" id="prospect-modal">
  <div class="prospect-modal" role="dialog" aria-modal="true" aria-labelledby="modal-prospect-name">

    <div class="prospect-modal__head">
      <h2 class="prospect-modal__name" id="modal-prospect-name">—</h2>
      <button class="prospect-modal__close" onclick="closeModal()" aria-label="Fechar">×</button>
    </div>

    <div class="prospect-modal__body">
      <div class="prospect-detail-row">
        <span class="prospect-detail-label">Email</span>
        <span class="prospect-detail-value" id="modal-email">—</span>
      </div>
      <div class="prospect-detail-row" id="modal-phone-row">
        <span class="prospect-detail-label">Telefone</span>
        <span class="prospect-detail-value" id="modal-phone">—</span>
      </div>
      <div class="prospect-detail-row">
        <span class="prospect-detail-label">Mensagem</span>
        <div class="prospect-detail-value" id="modal-message-wrap">—</div>
      </div>
      <div class="prospect-detail-row">
        <span class="prospect-detail-label">Origem</span>
        <span class="prospect-detail-value" id="modal-origin">—</span>
      </div>
      <div class="prospect-detail-row">
        <span class="prospect-detail-label">Data</span>
        <span class="prospect-detail-value" id="modal-date">—</span>
      </div>
    </div>

    <div class="prospect-modal__status-row">
      <span class="prospect-modal__status-label">Status</span>
      <select class="prospect-status-select" id="modal-status-select" onchange="updateStatus()">
        <option value="new">Novo</option>
        <option value="contacted">Em contato</option>
        <option value="potential">Cliente potencial</option>
        <option value="closed">Fechado</option>
        <option value="archived">Arquivado</option>
        <option value="converted">Convertido</option>
      </select>
      <span class="prospect-status-msg" id="status-msg"></span>
    </div>

    <div class="prospect-modal__actions">
      <button class="btn-reply" id="modal-reply-btn" onclick="toggleReplyArea()">
        ✉ Responder por email
      </button>
    </div>

    <div class="reply-area" id="reply-area">
      <span class="reply-area__label">Resposta</span>
      <span class="reply-area__to" id="reply-area-to"></span>
      <textarea class="reply-textarea" id="reply-textarea" placeholder="Digite sua mensagem..."></textarea>
      <div class="reply-actions">
        <button class="btn-send-reply" id="btn-send-reply" onclick="sendReply()">Enviar</button>
        <button class="btn-cancel-reply" onclick="toggleReplyArea()">Cancelar</button>
        <span class="reply-status" id="reply-status"></span>
      </div>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
<script>
let searchTimeout;
let currentProspectId = null;
// Map de id → objeto prospect para uso no event delegation (evita inline JSON no onclick)
const prospectCache = new Map();

(async () => {
  renderLayout('prospects');
  await requireAuth();
  await loadProspects(1);

  // Event delegation: um único listener na tbody, permanente
  document.getElementById('prospects-tbody').addEventListener('click', (e) => {
    const row = e.target.closest('tr[data-prospect-id]');
    if (!row) return;
    const p = prospectCache.get(row.dataset.prospectId);
    if (p) openModal(p);
  });

  // Fechar modal no overlay
  document.getElementById('prospect-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
})();

function onSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => loadProspects(1), 350);
}

async function loadProspects(page = 1) {
  const origin = document.getElementById('filter-origin').value;
  const status = document.getElementById('filter-status').value;
  const search = document.getElementById('search').value.trim();

  const params = new URLSearchParams({ page, limit: 50 });
  if (origin) params.set('origin', origin);
  if (status) params.set('status', status);
  if (search) params.set('search', search);

  const tbody = document.getElementById('prospects-tbody');
  tbody.innerHTML = `<tr><td colspan="6"><div class="loading"><div class="spinner"></div></div></td></tr>`;

  const data = await API.get(`/admin/prospects?${params}`);
  if (!data) return;

  document.getElementById('total-count').textContent = data.total ?? 0;

  if (!data.prospects?.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="empty-icon">📬</div>Nenhum interessado encontrado.</div></td></tr>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  // Armazena objetos no cache (sem trafegar dados via atributo HTML)
  prospectCache.clear();
  data.prospects.forEach(p => prospectCache.set(p.id, p));

  tbody.innerHTML = data.prospects.map(p => {
    const msg = p.metadata?.message || '';
    const msgPreview = msg.length > 60 ? msg.slice(0, 60) + '…' : msg || '—';
    return `
      <tr data-prospect-id="${p.id}">
        <td class="td-name">${escapeHtml(p.name || '—')}</td>
        <td class="td-mono">${escapeHtml(p.email)}</td>
        <td style="max-width:220px;color:var(--text-muted);font-size:.8rem">${escapeHtml(msgPreview)}</td>
        <td>${pillHTML(p.origin)}</td>
        <td>${pillHTML(p.status)}</td>
        <td class="td-date">${fmtDatetime(p.created_at)}</td>
      </tr>
    `;
  }).join('');

  const totalPages = Math.ceil(data.total / 50);
  document.getElementById('pagination').innerHTML = totalPages > 1 ? `
    <span>${(page-1)*50+1}–${Math.min(page*50, data.total)} de ${data.total}</span>
    <button class="btn btn-outline" onclick="loadProspects(${page-1})" ${page<=1?'disabled':''}>‹ Anterior</button>
    <button class="btn btn-outline" onclick="loadProspects(${page+1})" ${page>=totalPages?'disabled':''}>Próximo ›</button>
  ` : '';
}

function openModal(prospectJson) {
  const p = typeof prospectJson === 'string' ? JSON.parse(prospectJson) : prospectJson;
  currentProspectId = p.id;

  document.getElementById('modal-prospect-name').textContent = p.name || '(sem nome)';
  document.getElementById('modal-email').textContent = p.email;
  document.getElementById('modal-date').textContent = fmtDatetime(p.created_at);
  document.getElementById('modal-origin').innerHTML = pillHTML(p.origin);

  // Telefone — ocultar linha se não existir
  const phoneRow = document.getElementById('modal-phone-row');
  if (p.phone) {
    document.getElementById('modal-phone').textContent = p.phone;
    phoneRow.style.display = '';
  } else {
    phoneRow.style.display = 'none';
  }

  const msg = p.metadata?.message || null;
  const msgWrap = document.getElementById('modal-message-wrap');
  if (msg) {
    msgWrap.innerHTML = `<div class="prospect-message-box">${escapeHtml(msg)}</div>`;
  } else {
    msgWrap.textContent = '—';
  }

  document.getElementById('modal-status-select').value = p.status || 'new';
  document.getElementById('status-msg').textContent = '';
  document.getElementById('status-msg').className = 'prospect-status-msg';

  // Reset reply area
  closeReplyArea();

  document.getElementById('prospect-modal').classList.add('is-open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('prospect-modal').classList.remove('is-open');
  document.body.style.overflow = '';
  currentProspectId = null;
  closeReplyArea();
}

function closeReplyArea() {
  document.getElementById('reply-area').classList.remove('is-open');
  document.getElementById('reply-textarea').value = '';
  document.getElementById('reply-status').textContent = '';
  document.getElementById('reply-status').className = 'reply-status';
}

function toggleReplyArea() {
  const area = document.getElementById('reply-area');
  if (area.classList.contains('is-open')) {
    closeReplyArea();
    return;
  }
  // Preenche o "Para:" com o email atual
  const email = document.getElementById('modal-email').textContent;
  document.getElementById('reply-area-to').textContent = 'Para: ' + email;
  area.classList.add('is-open');
  document.getElementById('reply-textarea').focus();
}

async function sendReply() {
  if (!currentProspectId) return;
  const message = document.getElementById('reply-textarea').value.trim();
  if (!message) return;

  const btn = document.getElementById('btn-send-reply');
  const statusEl = document.getElementById('reply-status');
  btn.disabled = true;
  statusEl.textContent = 'Enviando…';
  statusEl.className = 'reply-status';

  const result = await API.post('/admin/reply', { prospectId: currentProspectId, message });

  if (result && result.ok) {
    statusEl.textContent = 'Email enviado ✓';
    statusEl.className = 'reply-status ok';
    document.getElementById('reply-textarea').value = '';
    // Atualiza status na tabela para "contacted" se for "new"
    const select = document.getElementById('modal-status-select');
    if (select.value === 'new') {
      select.value = 'contacted';
      const row = document.querySelector(`tr[data-prospect-id="${currentProspectId}"]`);
      if (row) {
        const cells = row.querySelectorAll('td');
        if (cells[4]) cells[4].innerHTML = pillHTML('contacted');
      }
    }
    setTimeout(() => {
      statusEl.textContent = '';
      statusEl.className = 'reply-status';
    }, 4000);
  } else {
    statusEl.textContent = result?.error || 'Erro ao enviar. Tente novamente.';
    statusEl.className = 'reply-status err';
  }
  btn.disabled = false;
}

async function updateStatus() {
  if (!currentProspectId) return;
  const status = document.getElementById('modal-status-select').value;
  const msgEl = document.getElementById('status-msg');
  msgEl.textContent = 'Salvando…';
  msgEl.className = 'prospect-status-msg';

  const result = await API.patch('/admin/prospects', { id: currentProspectId, status });
  if (result) {
    msgEl.textContent = 'Salvo ✓';
    msgEl.className = 'prospect-status-msg ok';
    // update pill in the table row
    const row = document.querySelector(`tr[data-prospect-id="${currentProspectId}"]`);
    if (row) {
      const cells = row.querySelectorAll('td');
      if (cells[4]) cells[4].innerHTML = pillHTML(status);
    }
  } else {
    msgEl.textContent = 'Erro ao salvar';
    msgEl.className = 'prospect-status-msg err';
  }
  setTimeout(() => { if (msgEl.textContent !== '') { msgEl.textContent = ''; } }, 3000);
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
