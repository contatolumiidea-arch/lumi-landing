<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interessados — LUMI Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <meta name="robots" content="noindex, nofollow">
  <style>
    /* ── Modal overlay ── */
    .prospect-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      z-index: 900;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .prospect-modal-overlay.is-open { display: flex; }

    /* ── Modal shell ── */
    .prospect-modal {
      background: var(--card, #11111C);
      border: 1px solid var(--border, #1E1E30);
      border-radius: 14px;
      width: 100%;
      max-width: 620px;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
      overflow: hidden;
    }

    /* ── Header ── */
    .pm-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border, #1E1E30);
      gap: 12px;
      flex-shrink: 0;
    }
    .pm-head__info { flex: 1; min-width: 0; }
    .pm-head__name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text, #EAEAF4);
      margin: 0 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pm-head__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: .8rem;
      color: var(--muted, #7070A0);
    }
    .pm-head__meta span { display: flex; align-items: center; gap: 4px; }
    .pm-close {
      background: none;
      border: none;
      color: var(--muted, #7070A0);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: -2px;
    }
    .pm-close:hover { color: var(--text, #EAEAF4); background: rgba(255,255,255,.05); }

    /* ── Status bar ── */
    .pm-status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      background: rgba(255,255,255,.025);
      border-bottom: 1px solid var(--border, #1E1E30);
      flex-shrink: 0;
    }
    .pm-status-label { font-size: .78rem; color: var(--muted, #7070A0); white-space: nowrap; }
    .pm-status-select {
      flex: 1;
      background: #0b0b0b;
      border: 1px solid rgba(200,168,75,.35);
      color: #f0f0f0;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: .82rem;
      cursor: pointer;
      color-scheme: dark;
    }
    .pm-status-select:focus { outline: none; border-color: var(--gold, #C8A84B); }
    .pm-status-select option { background: #111; color: #f0f0f0; }
    .pm-status-msg { font-size: .78rem; }
    .pm-status-msg.ok  { color: #4ade80; }
    .pm-status-msg.err { color: #f87171; }

    /* ── Conversation thread ── */
    .pm-thread {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    .pm-thread-label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted, #7070A0);
      margin-bottom: 4px;
    }
    .pm-thread-empty {
      font-size: .85rem;
      color: var(--muted, #7070A0);
      text-align: center;
      padding: 24px 0;
    }

    /* ── Message bubbles ── */
    .pm-msg {
      display: flex;
      flex-direction: column;
      max-width: 88%;
    }
    .pm-msg--cliente { align-self: flex-start; }
    .pm-msg--admin   { align-self: flex-end; }

    .pm-msg__bubble {
      padding: 11px 15px;
      border-radius: 12px;
      font-size: .875rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .pm-msg--cliente .pm-msg__bubble {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border, #1E1E30);
      color: var(--text, #EAEAF4);
      border-top-left-radius: 4px;
    }
    .pm-msg--admin .pm-msg__bubble {
      background: rgba(200,168,75,.12);
      border: 1px solid rgba(200,168,75,.25);
      color: var(--text, #EAEAF4);
      border-top-right-radius: 4px;
    }

    .pm-msg__footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: .72rem;
      color: var(--muted, #7070A0);
    }
    .pm-msg--admin .pm-msg__footer { justify-content: flex-end; }

    .pm-msg__sender {
      font-weight: 600;
    }
    .pm-msg--cliente .pm-msg__sender { color: var(--text-soft, #B8B8D0); }
    .pm-msg--admin   .pm-msg__sender { color: var(--gold, #C8A84B); }

    /* ── Loading skeleton for thread ── */
    .pm-thread-loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted, #7070A0);
      font-size: .82rem;
      padding: 12px 0;
    }
    .pm-thread-loading .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(200,168,75,.2);
      border-top-color: var(--gold, #C8A84B);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ── Reply box ── */
    .pm-reply {
      border-top: 1px solid var(--border, #1E1E30);
      padding: 16px 24px 20px;
      flex-shrink: 0;
    }
    .pm-reply__label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted, #7070A0);
      margin-bottom: 8px;
    }
    .pm-reply__to {
      font-size: .78rem;
      color: var(--muted, #7070A0);
      margin-bottom: 8px;
    }
    .pm-reply__textarea {
      width: 100%;
      min-height: 96px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border, #1E1E30);
      border-radius: 8px;
      color: var(--text, #EAEAF4);
      font-size: .875rem;
      line-height: 1.6;
      padding: 10px 12px;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color .15s;
    }
    .pm-reply__textarea:focus {
      outline: none;
      border-color: var(--gold, #C8A84B);
    }
    .pm-reply__textarea::placeholder { color: var(--muted, #7070A0); }
    .pm-reply__actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .pm-btn-send {
      background: var(--gold, #C8A84B);
      border: none;
      color: #000;
      border-radius: 7px;
      padding: 9px 22px;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
      letter-spacing: .01em;
    }
    .pm-btn-send:hover:not(:disabled) { opacity: .88; }
    .pm-btn-send:disabled { opacity: .4; cursor: not-allowed; }
    .pm-reply__status {
      font-size: .8rem;
      margin-left: auto;
    }
    .pm-reply__status.ok  { color: #4ade80; }
    .pm-reply__status.err { color: #f87171; }

    /* ── Table ── */
    .prospects-table tr[data-prospect-id] { cursor: pointer; }
    .prospects-table tr[data-prospect-id]:hover td { background: var(--bg-hover); }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="admin-layout">
  <div id="admin-sidebar-mount"></div>

  <div class="admin-main">
    <div class="admin-topbar">
      <span class="topbar-title">Interessados na LUMI</span>
    </div>

    <div class="admin-content">
      <div class="filter-bar">
        <input class="filter-input" id="search" type="text" placeholder="Buscar por nome ou email..." oninput="onSearch()">
        <select class="filter-select" id="filter-origin" onchange="loadProspects(1)">
          <option value="">Todas as origens</option>
          <option value="leadmagnet">Leadmagnet</option>
          <option value="newsletter">Newsletter</option>
          <option value="contact_form">Formulário contato</option>
        </select>
        <select class="filter-select" id="filter-status" onchange="loadProspects(1)">
          <option value="">Todos os status</option>
          <option value="new">Novo</option>
          <option value="contacted">Em contato</option>
          <option value="potential">Cliente potencial</option>
          <option value="closed">Fechado</option>
          <option value="archived">Arquivado</option>
          <option value="converted">Convertido</option>
        </select>
      </div>

      <div class="section-header">
        <span class="section-title">Interessados</span>
        <span class="section-count" id="total-count">—</span>
      </div>

      <div class="table-wrap">
        <div class="table-wrap-scroll">
          <table class="prospects-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Mensagem</th>
                <th>Origem</th>
                <th>Status</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody id="prospects-tbody">
              <tr><td colspan="7"><div class="loading"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── Prospect modal ── -->
<div class="prospect-modal-overlay" id="prospect-modal">
  <div class="prospect-modal" role="dialog" aria-modal="true" aria-labelledby="pm-name">

    <!-- Header -->
    <div class="pm-head">
      <div class="pm-head__info">
        <h2 class="pm-head__name" id="pm-name">—</h2>
        <div class="pm-head__meta">
          <span id="pm-email">—</span>
          <span id="pm-phone" style="display:none">—</span>
          <span id="pm-origin">—</span>
          <span id="pm-date">—</span>
        </div>
      </div>
      <button class="pm-close" onclick="closeModal()" aria-label="Fechar">×</button>
    </div>

    <!-- Status -->
    <div class="pm-status-bar">
      <span class="pm-status-label">Status</span>
      <select class="pm-status-select" id="pm-status-select" onchange="updateStatus()">
        <option value="new">Novo</option>
        <option value="contacted">Em contato</option>
        <option value="potential">Cliente potencial</option>
        <option value="closed">Fechado</option>
        <option value="archived">Arquivado</option>
        <option value="converted">Convertido</option>
      </select>
      <span class="pm-status-msg" id="pm-status-msg"></span>
    </div>

    <!-- Thread -->
    <div class="pm-thread" id="pm-thread">
      <div class="pm-thread-loading" id="pm-thread-loading">
        <div class="spinner"></div> Carregando histórico…
      </div>
    </div>

    <!-- Reply -->
    <div class="pm-reply">
      <div class="pm-reply__label">Nova resposta</div>
      <div class="pm-reply__to" id="pm-reply-to"></div>
      <textarea class="pm-reply__textarea" id="pm-reply-textarea" placeholder="Digite sua mensagem para o interessado..."></textarea>
      <div class="pm-reply__actions">
        <button class="pm-btn-send" id="pm-btn-send" onclick="sendReply()">Enviar email</button>
        <span class="pm-reply__status" id="pm-reply-status"></span>
      </div>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
<script>
let searchTimeout;
let currentProspectId = null;
const prospectCache = new Map();

(async () => {
  renderLayout('prospects');
  await requireAuth();
  await loadProspects(1);

  document.getElementById('prospects-tbody').addEventListener('click', (e) => {
    const row = e.target.closest('tr[data-prospect-id]');
    if (!row) return;
    const p = prospectCache.get(row.dataset.prospectId);
    if (p) openModal(p);
  });

  document.getElementById('prospect-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
})();

function onSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => loadProspects(1), 350);
}

async function loadProspects(page = 1) {
  const origin = document.getElementById('filter-origin').value;
  const status = document.getElementById('filter-status').value;
  const search = document.getElementById('search').value.trim();

  const params = new URLSearchParams({ page, limit: 50 });
  if (origin) params.set('origin', origin);
  if (status) params.set('status', status);
  if (search) params.set('search', search);

  const tbody = document.getElementById('prospects-tbody');
  tbody.innerHTML = `<tr><td colspan="7"><div class="loading"><div class="spinner"></div></div></td></tr>`;

  const data = await API.get(`/admin/prospects?${params}`);
  if (!data) return;

  document.getElementById('total-count').textContent = data.total ?? 0;

  if (!data.prospects?.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><div class="empty-icon">📬</div>Nenhum interessado encontrado.</div></td></tr>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  prospectCache.clear();
  data.prospects.forEach(p => prospectCache.set(p.id, p));

  tbody.innerHTML = data.prospects.map(p => {
    const msg = p.metadata?.message || '';
    const msgPreview = msg.length > 60 ? msg.slice(0, 60) + '…' : msg || '—';
    return `
      <tr data-prospect-id="${p.id}">
        <td class="td-name">${escapeHtml(p.name || '—')}</td>
        <td class="td-mono">${escapeHtml(p.email)}</td>
        <td class="td-mono" style="font-size:.8rem">${escapeHtml(p.phone || '—')}</td>
        <td style="max-width:200px;color:var(--text-muted);font-size:.8rem">${escapeHtml(msgPreview)}</td>
        <td>${pillHTML(p.origin)}</td>
        <td>${pillHTML(p.status)}</td>
        <td class="td-date">${fmtDatetime(p.created_at)}</td>
      </tr>
    `;
  }).join('');

  const totalPages = Math.ceil(data.total / 50);
  document.getElementById('pagination').innerHTML = totalPages > 1 ? `
    <span>${(page-1)*50+1}–${Math.min(page*50, data.total)} de ${data.total}</span>
    <button class="btn btn-outline" onclick="loadProspects(${page-1})" ${page<=1?'disabled':''}>‹ Anterior</button>
    <button class="btn btn-outline" onclick="loadProspects(${page+1})" ${page>=totalPages?'disabled':''}>Próximo ›</button>
  ` : '';
}

async function openModal(p) {
  currentProspectId = p.id;

  document.getElementById('pm-name').textContent = p.name || '(sem nome)';
  document.getElementById('pm-email').textContent = '✉ ' + p.email;
  document.getElementById('pm-date').textContent = '🕐 ' + fmtDatetime(p.created_at);
  document.getElementById('pm-origin').innerHTML = pillHTML(p.origin);
  document.getElementById('pm-reply-to').textContent = 'Para: ' + p.email;

  const phoneEl = document.getElementById('pm-phone');
  if (p.phone) {
    phoneEl.textContent = '📞 ' + p.phone;
    phoneEl.style.display = '';
  } else {
    phoneEl.style.display = 'none';
  }

  document.getElementById('pm-status-select').value = p.status || 'new';
  document.getElementById('pm-status-msg').textContent = '';
  document.getElementById('pm-status-msg').className = 'pm-status-msg';

  document.getElementById('pm-reply-textarea').value = '';
  document.getElementById('pm-reply-status').textContent = '';
  document.getElementById('pm-reply-status').className = 'pm-reply__status';

  document.getElementById('prospect-modal').classList.add('is-open');
  document.body.style.overflow = 'hidden';

  await loadThread(p);
}

async function loadThread(p) {
  const thread = document.getElementById('pm-thread');
  thread.innerHTML = `<div class="pm-thread-loading"><div class="spinner"></div> Carregando histórico…</div>`;

  const data = await API.get(`/admin/prospect-messages?prospectId=${p.id}`);

  if (!data || data.error) {
    const msg = data?.error || 'Erro ao carregar histórico.';
    const detail = data?.detail ? ` — ${data.detail}` : '';
    thread.innerHTML = `<div class="pm-thread-empty" style="color:#f87171">${msg}${detail}</div>`;
    return;
  }

  renderThread(data.messages || [], p);
}

function renderThread(messages, p) {
  const thread = document.getElementById('pm-thread');

  if (!messages.length) {
    // Se não há mensagens no histórico mas tem mensagem no metadata, exibir como inicial
    const initialMsg = p?.metadata?.message;
    if (initialMsg) {
      thread.innerHTML = `
        <div class="pm-thread-label">Histórico de atendimento</div>
        ${buildBubble({ sender_type: 'cliente', message: initialMsg, created_at: p.created_at }, p)}
      `;
    } else {
      thread.innerHTML = `
        <div class="pm-thread-label">Histórico de atendimento</div>
        <div class="pm-thread-empty">Nenhuma mensagem registrada ainda.</div>
      `;
    }
    return;
  }

  thread.innerHTML = `
    <div class="pm-thread-label">Histórico de atendimento</div>
    ${messages.map(m => buildBubble(m, p)).join('')}
  `;

  // Rolar para o fim do histórico
  thread.scrollTop = thread.scrollHeight;
}

function buildBubble(m, p) {
  const isAdmin = m.sender_type === 'admin';
  const sender  = isAdmin ? 'LUMI IDEA' : (p?.name || 'Interessado');
  const time    = fmtDatetime(m.created_at);
  return `
    <div class="pm-msg pm-msg--${m.sender_type}">
      <div class="pm-msg__bubble">${escapeHtml(m.message)}</div>
      <div class="pm-msg__footer">
        <span class="pm-msg__sender">${escapeHtml(sender)}</span>
        <span>${time}</span>
      </div>
    </div>
  `;
}

function closeModal() {
  document.getElementById('prospect-modal').classList.remove('is-open');
  document.body.style.overflow = '';
  currentProspectId = null;
}

async function updateStatus() {
  if (!currentProspectId) return;
  const status = document.getElementById('pm-status-select').value;
  const msgEl = document.getElementById('pm-status-msg');
  msgEl.textContent = 'Salvando…';
  msgEl.className = 'pm-status-msg';

  const result = await API.patch('/admin/prospects', { id: currentProspectId, status });
  if (result) {
    msgEl.textContent = 'Salvo ✓';
    msgEl.className = 'pm-status-msg ok';
    const row = document.querySelector(`tr[data-prospect-id="${currentProspectId}"]`);
    if (row) {
      const cells = row.querySelectorAll('td');
      if (cells[5]) cells[5].innerHTML = pillHTML(status);
    }
  } else {
    msgEl.textContent = 'Erro ao salvar';
    msgEl.className = 'pm-status-msg err';
  }
  setTimeout(() => { msgEl.textContent = ''; }, 3000);
}

async function sendReply() {
  if (!currentProspectId) return;
  const message = document.getElementById('pm-reply-textarea').value.trim();
  if (!message) return;

  const btn      = document.getElementById('pm-btn-send');
  const statusEl = document.getElementById('pm-reply-status');
  btn.disabled = true;
  statusEl.textContent = 'Enviando…';
  statusEl.className = 'pm-reply__status';

  const result = await API.post('/admin/reply', { prospectId: currentProspectId, message });

  if (result && result.ok) {
    // Adicionar bolha da resposta imediatamente no thread
    const thread = document.getElementById('pm-thread');
    const now    = result.sentAt || new Date().toISOString();
    const bubble = buildBubble({ sender_type: 'admin', message, created_at: now }, null);
    // Remove empty state se existir
    const empty = thread.querySelector('.pm-thread-empty');
    if (empty) empty.remove();
    thread.insertAdjacentHTML('beforeend', bubble);
    thread.scrollTop = thread.scrollHeight;

    document.getElementById('pm-reply-textarea').value = '';
    statusEl.textContent = 'Enviado ✓';
    statusEl.className = 'pm-reply__status ok';

    // Atualizar status na tabela e no select se for "new"
    const select = document.getElementById('pm-status-select');
    if (select.value === 'new') {
      select.value = 'contacted';
      const row = document.querySelector(`tr[data-prospect-id="${currentProspectId}"]`);
      if (row) {
        const cells = row.querySelectorAll('td');
        if (cells[5]) cells[5].innerHTML = pillHTML('contacted');
      }
    }

    setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'pm-reply__status'; }, 4000);
  } else {
    const msg    = result?.error  || 'Erro ao enviar. Tente novamente.';
    const detail = result?.detail ? ` (${result.detail})` : '';
    statusEl.textContent = msg + detail;
    statusEl.className = 'pm-reply__status err';
  }
  btn.disabled = false;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
